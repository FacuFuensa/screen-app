name: Core tests
on:
  push:
    branches: [main]
    paths: ["Packages/ScreenCore/**", ".github/workflows/core-tests.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/ScreenCore
