name: Screen
options:
  bundleIdPrefix: com.facufuensa
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: "2.55.1"
  ScreenCore:
    path: Packages/ScreenCore
settings:
  base:
    DEVELOPMENT_TEAM: RS6J29JLPS
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Screen:
    type: application
    platform: iOS
    sources: [Screen, Shared]
    dependencies:
      - package: Supabase
        product: Supabase
      - package: ScreenCore
      - target: ScreenMonitor
      - target: ScreenShieldConfig
      - target: ScreenShieldAction
    info:
      path: Screen/Info.plist
      properties:
        CFBundleDisplayName: Screen
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.facufuensa.screen.refresh]
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    entitlements:
      path: Screen/Screen.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.facufuensa.screen]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.facufuensa.screen
        TARGETED_DEVICE_FAMILY: "1"
        SUPABASE_URL: ""
        SUPABASE_ANON_KEY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ScreenMonitor:
    type: app-extension
    platform: iOS
    sources: [Extensions/Monitor, Shared]
    dependencies:
      - package: ScreenCore
    info:
      path: Extensions/Monitor/Info.plist
      properties:
        CFBundleDisplayName: ScreenMonitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ScreenMonitor
    entitlements:
      path: Extensions/Monitor/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.facufuensa.screen]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.facufuensa.screen.monitor
        TARGETED_DEVICE_FAMILY: "1"
  ScreenShieldConfig:
    type: app-extension
    platform: iOS
    sources: [Extensions/ShieldConfig, Shared]
    dependencies:
      - package: ScreenCore
    info:
      path: Extensions/ShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: ScreenShieldConfig
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: Extensions/ShieldConfig/ShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.facufuensa.screen]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.facufuensa.screen.shieldconfig
        TARGETED_DEVICE_FAMILY: "1"
  ScreenShieldAction:
    type: app-extension
    platform: iOS
    sources: [Extensions/ShieldAction, Shared]
    dependencies:
      - package: ScreenCore
    info:
      path: Extensions/ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: ScreenShieldAction
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: Extensions/ShieldAction/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.facufuensa.screen]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.facufuensa.screen.shieldaction
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Screen:
    build:
      targets:
        Screen: all
    run:
      config: Debug
    archive:
      config: Release
