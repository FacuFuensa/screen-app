name: iOS build
on:
  push:
    branches: [main]
    paths: ["Screen/**", "Shared/**", "Extensions/**", "Packages/**", "project.yml", ".github/workflows/ios-build.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build for simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Screen.xcodeproj -scheme Screen -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log | tail -n 80
      - name: Show compile errors
        if: failure()
        run: grep -E ' error:' xcodebuild.log | head -n 60 || true
      - name: Verify the three extensions are embedded
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Screen.app
          ls "$APP/PlugIns"
          test "$(ls "$APP/PlugIns" | grep -c '\.appex$')" -eq 3
          # A privacy manifest only counts if it is inside every bundle; a miss is invisible until upload.
          for b in "$APP" "$APP"/PlugIns/*.appex; do
            test -f "$b/PrivacyInfo.xcprivacy" || { echo "::error::PrivacyInfo.xcprivacy missing in $b"; exit 1; }
          done
          echo "Privacy manifest packaged in app and extensions."
          # iPhone-only: an iPad-capable bundle is rejected at upload for portrait-only orientation.
          family=$(plutil -extract UIDeviceFamily json -o - "$APP/Info.plist")
          test "$family" = "[1]" || { echo "::error::UIDeviceFamily is $family, expected [1]"; exit 1; }
          echo "iPhone-only bundle."
