name: TestFlight upload

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (e.g. 0.1.0)"
        default: "0.1.0"
        required: true

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; missing=1; fi
          done
          exit $missing

      - run: brew install xcodegen && xcodegen generate

      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: mkdir -p private && printf '%s\n' "$ASC_KEY_P8" > private/AuthKey.p8

      - name: Archive (automatic cloud signing)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          # xcodebuild echoes its argv; redact before anything reaches a file.
          redact () { sed -e "s|$SUPABASE_ANON_KEY|<redacted>|g"; }
          xcodebuild archive -project Screen.xcodeproj -scheme Screen -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Screen.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="${{ inputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}.${{ github.run_attempt }}" \
            SUPABASE_URL="$SUPABASE_URL" SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            2>&1 | redact | tee archive.log | tail -n 100

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/Screen.xcarchive \
            -exportOptionsPlist ci/exportOptions-appstore.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | tail -n 80
          echo "Build ${{ github.run_number }}.${{ github.run_attempt }} uploaded; it shows up in TestFlight after Apple processes it (5-15 min)."

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
