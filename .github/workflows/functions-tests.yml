name: Functions tests
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/functions-tests.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/_shared/
      - run: deno check supabase/functions/notify/index.ts supabase/functions/watchdog/index.ts
